# XcodeGen spec. On a Mac: `brew install xcodegen && cd iOS && xcodegen generate && open Mkoba.xcodeproj`
name: Mkoba
options:
  bundleIdPrefix: ke.mkoba
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  MkobaCore:
    path: ../
targets:
  Mkoba:
    type: application
    platform: iOS
    sources:
      - path: Mkoba
    dependencies:
      - package: MkobaCore
    info:
      path: Mkoba/Resources/Info.plist
      properties:
        CFBundleDisplayName: Mkoba
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          # No exceptions: every connection is TLS 1.2+ with forward secrecy.
          NSAllowsArbitraryLoads: false
        MKOBA_API_BASE_URL: $(MKOBA_API_BASE_URL)
    settings:
      base:
        MKOBA_API_BASE_URL: https://mkoba-api.example.com
        PRODUCT_BUNDLE_IDENTIFIER: ke.mkoba.app
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - MkobaTests
        - MkobaUITests
      gatherCoverageData: true
  MkobaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MkobaTests]
    dependencies:
      - target: Mkoba
  MkobaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MkobaUITests]
    dependencies:
      - target: Mkoba
