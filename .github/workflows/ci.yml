name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-linux:
    name: Core + server (Linux, Swift 6.4)
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: swift test --parallel
      - name: Server tests
        working-directory: Server
        run: swift test

  ios:
    name: iOS app (Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Generate project
        run: brew install xcodegen && cd iOS && xcodegen generate
      - name: Build and unit test
        run: |
          xcodebuild test -project iOS/Mkoba.xcodeproj -scheme Mkoba \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:MkobaTests -resultBundlePath TestResults.xcresult | xcpretty
      - name: UI tests
        run: |
          xcodebuild test -project iOS/Mkoba.xcodeproj -scheme Mkoba \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:MkobaUITests | xcpretty
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcresult
          path: TestResults.xcresult
