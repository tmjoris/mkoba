name: CI

on:
  push:
    branches: [main, sms-import]
  pull_request:

jobs:
  core-linux:
    name: Core + server (Linux, Swift 6.4)
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: swift test --parallel
      - name: Server tests
        working-directory: Server
        run: swift test

  ios:
    name: iOS app (Xcode)
    # macos-26: AnyLanguageModel needs Swift 6.3 tools, and the on-device model needs the iOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain and pick a simulator
        run: |
          xcodebuild -version
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID"
      - name: Generate project
        run: brew install xcodegen && cd iOS && xcodegen generate
      - name: Build and unit test
        run: |
          xcodebuild test -project iOS/Mkoba.xcodeproj -scheme Mkoba -skipMacroValidation \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:MkobaTests -resultBundlePath TestResults.xcresult
      - name: UI tests
        run: |
          xcodebuild test -project iOS/Mkoba.xcodeproj -scheme Mkoba -skipMacroValidation \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:MkobaUITests -resultBundlePath UITestResults.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcresult
          path: |
            TestResults.xcresult
            UITestResults.xcresult
